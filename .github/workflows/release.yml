name: Release

# A vMAJOR.MINOR.PATCH tag builds a signed release APK and publishes it as a
# GitHub release. Running the workflow by hand (Actions > Release > Run
# workflow) does a dry run: the same signed build and checks, with the APK
# kept as a workflow artifact and no release. A dry run from main also warms
# the native-library cache that tag builds restore.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5

      - name: Version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 scripts/release_version.py "$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
          else
            # Dry run: keep build.gradle.kts's defaults.
            echo "name=dryrun-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
          fi

      # sherpa-onnx's native libraries are git-ignored build outputs. Build
      # them with the same pinned script as on a dev machine; the cache key is
      # the script, which holds every pin and build flag.
      - name: Restore sherpa-onnx native libraries
        id: jni
        uses: actions/cache@v5
        with:
          path: audio/src/main/jniLibs
          key: sherpa-onnx-jni-${{ hashFiles('scripts/build-sherpa-onnx.sh') }}
      - name: Build sherpa-onnx native libraries
        if: steps.jni.outputs.cache-hit != 'true'
        run: |
          # The NDK and CMake pins live in the script; install exactly those.
          pin() { sed -n "s/^$1=\"\([^\"]*\)\".*/\1/p" scripts/build-sherpa-onnx.sh; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$(pin NDK_VERSION)" "cmake;$(pin CMAKE_VERSION)" </dev/null >/dev/null
          STSLOOP_CACHE="$RUNNER_TEMP/stsloop-cache" scripts/build-sherpa-onnx.sh
          # The script also re-vendors the Kotlin API; it must match what is committed.
          drift="$(git status --porcelain -- audio/src/main/kotlin/com/k2fsa)"
          [[ -z "$drift" ]] || { echo "::error::vendored sherpa-onnx Kotlin API drifted:"; echo "$drift"; exit 1; }

      - name: Decode the signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$RELEASE_KEYSTORE_BASE64" ]] || { echo "::error::RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          base64 -d <<<"$RELEASE_KEYSTORE_BASE64" >"$RUNNER_TEMP/release.jks"

      - name: Build the release APK
        env:
          STSLOOP_KEYSTORE: ${{ runner.temp }}/release.jks
          STSLOOP_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          STSLOOP_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STSLOOP_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          props=()
          if [[ -n "$VERSION_CODE" ]]; then
            props=(-Pstsloop.versionName="$VERSION_NAME" -Pstsloop.versionCode="$VERSION_CODE")
          fi
          ./gradlew :app:assembleRelease "${props[@]}"

      - name: Verify the APK
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          src=app/build/outputs/apk/release/app-release.apk
          [[ -f "$src" ]] || { echo "::error::no signed APK (was it built unsigned?)"; ls app/build/outputs/apk/release; exit 1; }
          apk="$RUNNER_TEMP/stsloop-$VERSION_NAME.apk"
          cp "$src" "$apk"
          tools="$ANDROID_HOME/build-tools/37.0.0"

          certs="$("$tools/apksigner" verify --verbose --print-certs "$apk")"
          grep -E '^(Verifies|Verified using|Number of signers|.*Signer: certificate (DN|SHA-256 digest))' <<<"$certs"
          grep -qx 'Number of signers: 1' <<<"$certs"
          ! grep -q 'CN=Android Debug' <<<"$certs" || { echo "::error::signed with the debug key"; exit 1; }
          # An APK signed with any other key won't install over the previous release.
          # Once set, the repo variable RELEASE_CERT_SHA256 pins the key (the digest printed above).
          if [[ -n "$RELEASE_CERT_SHA256" ]]; then
            grep -q "certificate SHA-256 digest: ${RELEASE_CERT_SHA256,,}\$" <<<"$certs" ||
              { echo "::error::not signed with the pinned release key ($RELEASE_CERT_SHA256)"; exit 1; }
          fi

          # Without these the app dies with UnsatisfiedLinkError on first speech.
          libs="$(unzip -Z1 "$apk")"
          for so in lib/arm64-v8a/libsherpa-onnx-jni.so lib/arm64-v8a/libonnxruntime.so; do
            grep -qx "$so" <<<"$libs" || { echo "::error::$so missing from the APK"; exit 1; }
          done

          badging="$("$tools/aapt2" dump badging "$apk")"
          badging="${badging%%$'\n'*}" # the package line
          echo "$badging"
          if [[ -n "$VERSION_CODE" ]]; then
            grep -q "versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<<"$badging"
          fi
          echo "path=$apk" >>"$GITHUB_OUTPUT"

      - name: Keep the dry-run APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: stsloop-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --verify-tag --title "stsloop $GITHUB_REF_NAME" --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
